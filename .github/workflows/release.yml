name: Release

# Every run builds and smoke-tests the executable. A release is only created when a
# tag such as v0.1.0 is pushed, and the tag must match pdf_fusion.__version__.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import pdf_fusion; print(pdf_fusion.__version__)")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Build the executable
        run: pyinstaller packaging/pdf-fusion.spec --noconfirm
      - name: Smoke test the executable
        shell: bash
        run: dist/PDF-Fusion.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Fusion-windows
          path: dist/PDF-Fusion.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: PDF-Fusion-windows
          path: dist
      - name: Take the release notes from CHANGELOG.md
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not match:
              raise SystemExit(f"No changelog section for {version}")
          pathlib.Path("release-notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PDF-Fusion.exe \
            --title "PDF Fusion $GITHUB_REF_NAME" \
            --notes-file release-notes.md
